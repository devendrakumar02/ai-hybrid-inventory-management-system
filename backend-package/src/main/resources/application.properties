spring.application.name=hybrid-inventory
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

ai.service.url=${AI_SERVICE_URL:http://localhost:5000}

spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

inventory.alert.email=${ALERT_RECIPIENT_EMAIL:inventory-admin@example.com}
inventory.alert.manager.email=${ALERT_MANAGER_EMAIL:store-manager@example.com}
inventory.alert.cooldown-hours=${ALERT_COOLDOWN_HOURS:24}
inventory.alert.retry.interval-ms=${ALERT_RETRY_INTERVAL_MS:300000}
inventory.alert.max-retries=${ALERT_MAX_RETRIES:5}
inventory.sqlite.db-path=${SQLITE_DB_PATH:alert_queue.db}
inventory.alert.worker.delay=30000
